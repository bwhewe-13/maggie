[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maggie"
version = "0.1.0"
description = "Mesh-Agnostic Graphics for Group-wise Iteration and Evolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "h5py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
]

[project.scripts]
maggie = "maggie.app:main"

[project.gui-scripts]
maggie-gui = "maggie.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
